# wxcli Codex playbook config — GENERATED into .codex/config.toml. Do not hand-edit.
# These apply once you trust this folder in Codex (codex trusts the repo/cwd).
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# NO SAFETY GATE SHIPS HERE, and that is a known gap, not an oversight.
# The other playbook variant ships a pre-tool-use hook that routes state-changing
# wxcli calls through the wxc-calling-builder agent. This variant gets the agents
# and the skills but no equivalent gate, so the only guard on a destructive
# command here is the CLI's own confirmation prompt.
#
# Measured on Codex 0.144.1, 2026-08-10. The machinery exists and the wire format
# is a near match: events are snake_case in .codex/hooks.json (pre_tool_use,
# session_start, ...), the payload carries agent_type / tool_name / tool_input,
# and the reply is hookSpecificOutput.permissionDecision of allow|deny|ask. But a
# repo-local .codex/hooks.json was DISCOVERED and never EXECUTED: three
# `codex exec` runs, zero invocations, including a session_start hook (no matcher
# to get wrong) and absolute command paths (no cwd to get wrong). Whether it
# fires in an INTERACTIVE session is untested. That open question is the reason
# nothing is wired here, rather than something unverified.
#
# Two things to get right whenever this is finished:
#   - The shell tool is named `exec`, so a matcher written against a different
#     tool name silently matches nothing — a gate that looks present and is not.
#   - Codex persists per-hook trust (a trusted_hash in ~/.codex/config.toml), so
#     a shipped gate is opt-in on first run rather than simply active.
#
# The "newer wxcli on PyPI" nudge needs no hook either way: the CLI prints a
# one-line update banner on startup (see update_check.py).
