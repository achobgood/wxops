# wxcli Codex playbook config — GENERATED into .codex/config.toml. Do not hand-edit.
# These apply once you trust this folder in Codex (codex trusts the repo/cwd).
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# NO SAFETY GATE SHIPS HERE, and that is a known gap, not an oversight.
# The other playbook variant ships a pre-tool-use hook that routes state-changing
# wxcli calls through the wxc-calling-builder agent. This variant gets the agents
# and the skills but no equivalent gate, so the only guard on a destructive
# command here is the CLI's own confirmation prompt.
#
# HOOKS DO WORK on Codex 0.144.1 — verified 2026-08-10 with live payloads. The
# blocker is not the mechanism; it is agent identity. See the bottom of this note.
#
# Working config, .codex/hooks.json (project-local) or ~/.codex/hooks.json
# (global) — both are supported:
#
#   { "hooks": { "PreToolUse": [ { "matcher": "^Bash$",
#       "hooks": [ { "type": "command", "command": "sh /abs/path/gate.sh" } ] } ] } }
#
#   - Event keys are CamelCase: PreToolUse, SessionStart. NOT snake_case.
#     snake_case keys PARSE WITHOUT ERROR and then match nothing — the map takes
#     string keys, so a wrong event name is silently inert. That cost seven runs.
#   - The shell tool is `Bash`. Not `exec` — `exec` is only the tool_use_id
#     prefix, which is what an earlier reading of this file got wrong.
#   - PreToolUse is the command gate and can deny before execution.
#     PermissionRequest fires only when Codex would already ask, so it is not a
#     universal gate.
#   - Codex persists per-hook trust (a trusted_hash in ~/.codex/config.toml), so
#     a shipped gate is opt-in on first run rather than simply active.
#
# WHY NO GATE SHIPS ANYWAY: the payload carries no agent NAME. `agent_type` is
# "default" for the main session AND for a spawned subagent; the real identity
# (agent_role) appears in the transcript but never in the hook payload.
# `agent_id` is no substitute — absent for an interactive main session, present
# for both `codex exec` and subagents, and a UUID rather than a name.
# Caveat on that: only a DEFAULT subagent has been observed reporting "default".
# A named profile has never been captured cleanly, so "the profile name never
# reaches the hook" is UNPROVEN rather than established. It is the one question
# that decides whether the other variant's name-based design is portable.
#
# One hard constraint for whoever builds this: emit ONLY "allow" or "deny".
# A hook returning "ask" is rejected with `hook: PreToolUse Failed` AND THE
# COMMAND STILL RUNS — an unrecognised decision degrades to permission granted,
# so a typo in the decision string is an open door. Native approval prompts live
# on PermissionRequest, which fires only where Codex would already ask and is
# therefore not a universal gate.
#
# The "newer wxcli on PyPI" nudge needs no hook either way: the CLI prints a
# one-line update banner on startup (see update_check.py).
