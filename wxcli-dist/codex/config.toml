# wxcli Codex playbook config — GENERATED into .codex/config.toml. Do not hand-edit.
# These apply once you trust this folder in Codex (codex trusts the repo/cwd).
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Optional "a newer wxcli is on PyPI → run wxcli update" nudge. Repo-local hooks
# do NOT fire in interactive Codex sessions (openai/codex#17532), so this can only
# be installed GLOBALLY in ~/.codex/config.toml, not here. The wxcli CLI already
# prints a one-line PyPI update banner on startup (see update_check.py) — that is
# the primary path for Codex. Add the hook below only if you also want a
# session-start nudge:
#
# [[hooks.SessionStart]]
# [[hooks.SessionStart.hooks]]
# type = "command"
# command = "wxcli update --hook"
# timeout = 15
