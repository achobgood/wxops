[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wxcli"
dynamic = ["version"]
description = "Webex Calling CLI — terminal-based provisioning for Webex APIs"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    # typer floor verified 2026-08-04 in throwaway venvs (pip install -e . +
    # pip install typer==<version>), checking `wxcli --version`, `wxcli --help`,
    # and `wxcli people list --help` exit 0. Every version from 0.9.0 through
    # 0.19.2 fails at least one: 0.9.0 makes `--version` exit 2; 0.15.0-0.19.2
    # (spot-checked 0.15.0/0.17.1/0.17.5/0.18.0/0.19.0/0.19.1/0.19.2) all make
    # the subcommand --help raise `AttributeError: 'LazyTyper' object has no
    # attribute 'suggest_commands'` from SafeSuggestGroup in suggest.py. 0.20.0
    # is the lowest version where all three pass; 0.24.1 and 0.27.1 also verified
    # clean (0.27.1 additionally green on the full CI suite). No upper bound:
    # CI resolves fresh and actually executes on every run, which catches a
    # future break faster than a pin that goes stale.
    "typer>=0.20.0",
    # click floor: typer==0.20.0's own metadata only requires click>=8.0.0, but
    # this floor was verified directly rather than lowered to match — typer==0.20.0
    # paired with click==8.1.0 (the version below) passed all three checks above
    # on 2026-08-04.
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27.0",
    "jmespath>=1.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "networkx>=3.0",
    "phonenumbers>=8.13",
    "requests>=2.31",
    "urllib3>=2.0",
    "zeep>=4.2",
]
readme = "README.md"
authors = [{name = "Adam Hobgood"}]
keywords = ["webex", "cisco", "calling", "cli", "provisioning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/achobgood/wxops"
Repository = "https://github.com/achobgood/wxops"
Issues = "https://github.com/achobgood/wxops/issues"
Changelog = "https://github.com/achobgood/wxops/releases"

[project.scripts]
wxcli = "wxcli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Explicit dot-directory patterns are required: setuptools' recursive glob does
# not descend into them, so "_playbook/**" alone would drop Claude/Codex files.
wxcli = ["_playbook/**", "_playbook/.claude/**", "_playbook/.codex/**"]

[tool.setuptools_scm]
write_to = "src/wxcli/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: requires live Webex API access (deselect with '-m not live')",
]
