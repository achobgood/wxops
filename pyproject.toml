[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wxcli"
dynamic = ["version"]
description = "Webex Calling CLI — terminal-based provisioning for Webex APIs"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "typer[all]>=0.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
]
readme = "README.md"
authors = [{name = "Adam Hobgood"}]
keywords = ["webex", "cisco", "calling", "cli", "provisioning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/achobgood/wxops"
Repository = "https://github.com/achobgood/wxops"
Issues = "https://github.com/achobgood/wxops/issues"
Changelog = "https://github.com/achobgood/wxops/releases"

[project.scripts]
wxcli = "wxcli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Both patterns are required: setuptools' recursive glob does not descend
# into dot-directories, so "_playbook/**" alone would drop .claude/ from the wheel.
wxcli = ["_playbook/**", "_playbook/.claude/**"]

[tool.setuptools_scm]
write_to = "src/wxcli/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: requires live Webex API access (deselect with '-m not live')",
]
