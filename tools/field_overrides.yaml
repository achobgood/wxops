    list-usage-dial-plan: *route_id_name
    list-usage-pstn-connection-route-groups: *route_id_name
    list-usage-call-to-extension-trunks: *route_id_name
    list-usage-route-list: *route_id_name
    list-usage-route-group: &route_in_use
      - ["ID", "id"]
      - ["Name", "name"]
      - ["In Use", "inUse"]
    list-route-groups: *route_in_use
    list-trunks:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Trunk Type", "trunkType"]
    list-trunk-types:
      - ["Trunk Type", "trunkType"]
      - ["Device Types", "deviceTypes"]
    list-route-lists:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Location", "locationName"]
    list-translation-patterns:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Pattern", "matchingPattern"]
      - ["Level", "level"]

