# Re-verified 2026-07-29, when the shadowing that made this block inert was
# fixed. The six list-available-numbers-* entries were deleted: each declared
# only [phoneNumber, state], while the derived default declares the same two
# plus isMainNumber / tollFreeNumber / telephonyType — all schema-valid, all
# things you need to see when picking a number, and the same shape the APPLIED
# available-numbers overrides on Hunt Group / Auto Attendant / Paging Group
# already use. Keeping the two-column form would have made this group the
# outlier.
#
# The two job lists are kept: both return a JobDetailsResponse whose point is
# `latestExecutionStatus`, and the derived default reaches for
# name/trackingId/sourceUserId/sourceCustomerId instead — provisioning
# internals. list-delete-calling-location is load-bearing for the corrected
# teardown flow, which polls exactly this field (see command_help_notes on
# safe-delete-check under tag_overrides).
"Location Call Settings":
  table_columns:
    list-update-routing-prefix:
      - ["ID", "id"]
      - ["Status", "latestExecutionStatus"]
    list-delete-calling-location:
      - ["ID", "id"]
      - ["Location", "locationName"]
      - ["Status", "latestExecutionStatus"]

