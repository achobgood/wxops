# CLI commands whose endpoints are ahead of the published spec — kept
# deliberately. Each entry excuses one (method, path) from the drift gate's
# CLI-ahead-of-spec check. Format: "METHOD /path" (path params in braces,
# base URL stripped). Only add an entry with a dated reason comment proving
# the endpoint still works live (known-good private endpoint); otherwise let
# the regen drop the command. NOTE: regen rebuilds modules from the spec, so
# a kept command must live in a hand-written extension module mounted onto
# the generated group (the converged_recordings_export.register() pattern).
# Decisions for the 13 CLI-ahead CC commands land at the first spec sync.
keep_endpoints:
  # 2026-07-01 operator decision (Adam): keep the CLI-ahead cc-ai-assistant
  # command even though the AI Assistant tag was removed from the
  # published CC spec — the generator cannot rebuild this module while the
  # tag is absent, so it stays a hand-maintained holdout.
  #
  # 2026-07-25 live probe (16:16:01 UTC) DISPROVES "may still work
  # server-side": POST https://api.wxcc-us1.cisco.com/event -> 404,
  # content-length: 0, empty body, server: istio-envoy, with real
  # trackingid/x-request-id headers. Control: wxcli cc-site list -o json
  # -> 200 with real data on the same token, ruling out an auth/scope
  # artifact. Calibration: a different bad path on the same base URL
  # returned 404 WITH a structured JSON backend body naming the resolved
  # downstream path — a routed path reaches a backend that answers in
  # JSON. /event's bare gateway 404 means no route is registered upstream
  # for this operation at all.
  #
  # cc_ai_assistant.py was hand-converted on 2026-07-25 to match the
  # uniform --output/--fields/--generate-json-body/httpx-error surface
  # every generated command now has, because the generator cannot rebuild
  # it while the tag is absent. If the AI Assistant tag ever returns
  # upstream, the regen REPLACES this file wholesale and automatically
  # produces the correct modern surface (the renderer emits --fields,
  # uniform --output, --generate-json-body, and the httpx handler for
  # every command) — no follow-up hand-editing needed.
  #
  # RECOMMENDED FOLLOW-UP: retire this command group entirely (delete the
  # module, unregister it from _registry.py, drop this keep_endpoints
  # entry). Deferred from this branch only because it changes the drift
  # baseline from 176 command sets / 1872 commands to 175 / 1871, which
  # this plan's gate is specified to match exactly.
  - "POST /event"   # cc-ai-assistant create ({cc_base_url}/event)

# Per-spec tag-level overrides (command_name_overrides, body_defaults, etc.)
# Replaces top-level tag blocks that collide across specs (e.g., "Flow").
# Non-colliding top-level tag blocks still work via backwards compat.
tag_overrides:
  webex-cloud-calling.json:
    # 2026-06 spec added org-wide queue-settings ops that claim the bare
    # show/update names, demoting the per-queue commands to
    # show-queues/update-queues. Six skills and operator muscle memory rely
    # on `call-queue show/update LOCATION_ID QUEUE_ID` — pin the per-queue
    # pair to the bare names; the new org-wide pair gets -org-settings
    # (plain -settings collides with the per-queue settings GET).
    "Features:  Call Queue":
      command_name_overrides:
        "show": "show-org-settings"
        "update": "update-org-settings"
        "show-queues": "show"
        "update-queues": "update"
  webex-contact-center.json:
    "Flows":   # tag renamed upstream from "Flow"
      command_name_overrides:
        "list-export": "export"
        "create": "publish"
    "Users":
      command_name_overrides:
        "update-update-dynamic-skill": "update-dynamic-skill"

# Tag-level override for Operating Modes
"Features: Operating Modes":
