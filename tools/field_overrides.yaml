# CLI commands whose endpoints are ahead of the published spec — kept
# deliberately. Each entry excuses one (method, path) from the drift gate's
# CLI-ahead-of-spec check. Format: "METHOD /path" (path params in braces,
# base URL stripped). Only add an entry with a dated reason comment proving
# the endpoint still works live (known-good private endpoint); otherwise let
# the regen drop the command. NOTE: regen rebuilds modules from the spec, so
# a kept command must live in a hand-written extension module mounted onto
# the generated group (the converged_recordings_export.register() pattern).
# Decisions for the 13 CLI-ahead CC commands land at the first spec sync.
keep_endpoints:
  # 2026-07-01 operator decision (Adam): keep the CLI-ahead cc-ai-assistant
  # command even though the AI Assistant tag was removed from the
  # published CC spec — the generator cannot rebuild this module while the
  # tag is absent, so it stays a hand-maintained holdout.
  #
  # 2026-07-25 live probe (16:16:01 UTC) DISPROVES "may still work
  # server-side": POST https://api.wxcc-us1.cisco.com/event -> 404,
  # content-length: 0, empty body, server: istio-envoy, with real
  # trackingid/x-request-id headers. Control: wxcli cc-site list -o json
  # -> 200 with real data on the same token, ruling out an auth/scope
  # artifact. Calibration: a different bad path on the same base URL
  # returned 404 WITH a structured JSON backend body naming the resolved
  # downstream path — a routed path reaches a backend that answers in
  # JSON. /event's bare gateway 404 means no route is registered upstream
  # for this operation at all.
  #
  # cc_ai_assistant.py was hand-converted on 2026-07-25 to match the
  # uniform --output/--fields/--generate-json-body/httpx-error surface
  # every generated command now has, because the generator cannot rebuild
  # it while the tag is absent. If the AI Assistant tag ever returns
  # upstream, the regen REPLACES this file wholesale and automatically
  # produces the correct modern surface (the renderer emits --fields,
  # uniform --output, --generate-json-body, and the httpx handler for
  # every command) — no follow-up hand-editing needed.
  #
  # RECOMMENDED FOLLOW-UP: retire this command group entirely (delete the
  # module, unregister it from _registry.py, drop this keep_endpoints
  # entry). Deferred from this branch only because it changes the drift
  # baseline from 176 command sets / 1872 commands to 175 / 1871, which
  # this plan's gate is specified to match exactly.
  - "POST /event"   # cc-ai-assistant create ({cc_base_url}/event)

# ═══════════════════════════════════════════════════════════════════════════════
# inert_tag_ack — tag-keyed config that cannot resolve today, kept on purpose
# ═══════════════════════════════════════════════════════════════════════════════
# Read by drift_check.py check 15. A tag block, tag_overrides entry or
# cli_name_overrides entry naming a tag no spec on disk declares is normally a
# defect: it parses, the tests pass, and it does nothing (that is how six blocks
# stayed inert until 2026-07-29). An entry here declares the exception and says
# why. The check re-validates every ack: if the tag comes back, the ack itself
# fails, so this list cannot rot into an allowlist.
inert_tag_ack:
  "AI Assistant": >
    Dormant by decision, not stale. Upstream REMOVED this tag from the published
    CC spec; the 2026-07-01 operator decision (see keep_endpoints above) keeps
    cc_ai_assistant.py as a hand-maintained holdout. The cli_name_overrides entry
    stays so that if the tag returns, the regen rebuilds the module under the
    group name already mounted and documented — deleting it would silently rename
    the group to `ai-assistant` on that day.

# Drift-gate check 16: a list command whose `--all` is inert because the spec
# declares no paging parameter and no Link header, on an endpoint whose own 200
# schema declares a paging total. Ack = "measured, kept for now"; the fix is
# generator work (teach _pagination_style to read the response schema), which
# flips these to a walking branch and requires a regen. Every ack is re-checked
# each run — one whose operation stops qualifying fails as STALE.
undeclared_paging_ack:
  "GET /identity/organizations/{}/v1/ArchivedUser": >
    Measured 2026-07-29, static evidence only — no live call. Response declares
    `totalResults`, the SCIM spelling, but the operation declares neither
    `startIndex`/`count` nor a Link header, so it renders non-paginating and all
    three paging controls miss: `--limit` sends `max`, `--offset` sends `start`,
    `--all` is inert. SCIM reads `startIndex`/`count`, so the stderr truncation
    note (which DOES fire here, since _body_says_more reads totalResults) names
    two remedies that cannot work on this command. Fixing it means routing this
    operation to the scim walker, i.e. a generator change plus a regen — out of
    scope for the documentation pass that added this check. Stops qualifying if
    upstream declares the SCIM parameters or the generator learns to read the
    schema.
  "GET /contacts/organizations/{}/contacts/search": >
    Measured 2026-07-29, static evidence only — no live call. Response declares
    `total`; the operation declares `limit` but no offset parameter and no Link
    header, so it renders non-paginating and `--all` is inert. `--offset` sends
    `start`, and whether this endpoint reads `start` is UNVERIFIED — proving it
    needs an org with more contacts than one page. Same fix and same staleness
    condition as the entry above.

