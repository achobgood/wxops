# ── field_overrides.yaml ──
# Overrides for the wxcli OpenAPI-based generator (tools/generate_commands.py).
#
# The OpenAPI spec now provides: response schemas, required fields, command types,
# enum values, and descriptions. This file only contains what the spec does NOT provide:
#
#   table_columns       — display columns for CLI table output (per-group or per-command)
#   skip_tags           — glob patterns for OpenAPI tags to skip entirely
#   tag_merge           — merge split tags into one CLI group
#   tag_op_excludes     — drop spurious tag/operation pairings (tag → path globs)
#   verb_semantics_ack  — acked verb-vs-semantics mismatches (issue #20)
#   cli_name_overrides  — human-friendly CLI group names (tag → CLI name)
#   omit_query_params   — query params stripped from all commands
#   spec_authority      — which spec wins when two describe one op differently
#
# Per-tag keys (alongside table_columns etc.):
#   param_name_overrides — rename a spec param's CLI flag; wire name unchanged.
#                          Use when a spec param collides with --fields/--output.
#                          {command: {spec_param: new-kebab-name}}. Validated at
#                          generation time, so a stale entry fails loudly.
#

# ═══════════════════════════════════════════════════════════════════════════════
# Table columns — display preferences for CLI table output
# ═══════════════════════════════════════════════════════════════════════════════

"Report Templates":
  list:
    table_columns:
      - ["ID", "id"]   # schema field is lowercase; _resolve_accessor is case-sensitive
      - ["Title", "title"]
      - ["Service", "service"]
      - ["Max Days", "maxDays"]

# CDR record keys are space-separated Title-case, NOT camelCase — confirmed by
# the spec's own property names, docs/reference/reporting-analytics.md, and the
# cdr-recipes written against real data (r.get('Start time')). With camelCase
# every column resolved empty, which tripped output.py's auto_columns fallback
# and ballooned the table to 40+ auto-detected columns instead of rendering blank.
"Reports: Detailed Call History":
  table_columns:
    list: &cdr_cols
      - ["Start Time", "Start time"]
      - ["Calling Number", "Calling number"]
      - ["Called Number", "Called number"]
      - ["Duration", "Duration"]
      - ["Direction", "Direction"]
      - ["Call Type", "Call type"]
    list-cdr_stream: *cdr_cols

# Per-command style, NOT the old `list: {table_columns:}` block. The old style
# falls through command_renderer.py:580 and is applied to EVERY list-shaped
# command in the tag, so the parent entity's columns leaked onto the
