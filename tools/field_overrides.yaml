# ═══════════════════════════════════════════════════════════════════════════════
# naming_ack — command names whose obvious reading is wrong, acknowledged
# ═══════════════════════════════════════════════════════════════════════════════
# Read by drift_check.py check 12 (tools/verb_naming.py does the classifying).
#
# WHAT THIS IS. Two defect classes the generator cannot decide for itself:
#   numeric-suffix    `_dedup_command_names` broke a name collision with -1/-2,
#                     which tells the caller nothing.
#   resource-mismatch a bare list/show/create/update/delete whose URL targets
#                     something other than the group's headline resource. The
#                     obvious name runs, exits 0, and answers a different
#                     question.
#
# THE THRESHOLD (Adam, 2026-07-28). CRITICAL+HIGH fails the build. CRITICAL
# alone would gate nothing: the only CRITICAL findings anywhere are the four
# `update-access-codes` commands kept by decision on 2026-07-14. Numeric
# suffixes fail at any severity. MEDIUM is reported, never gated.
#
# WHAT AN ENTRY MEANS. "This shipped on 2026-07-28 and we are not renaming it
# today." It is a snapshot of existing debt so that NEW debt fails the build —
# it is not an argument that the name is good.
#
# HOW IT CANNOT ROT. The key is the OPERATION (`<kind> <METHOD> <path>`), and
# the entry records the command name and severity it was written for. Rename
# the command, or have it reclassify, and check 12 reports the ack as STALE and
# fails — so an exemption can never drift onto a name nobody reviewed. Deleting
# a fixed command's ack is part of fixing it.
#
# TO FIX ONE INSTEAD OF ACKING IT: rename via the tag's command_name_overrides;
# the generator keeps the old name as a hidden alias automatically.
naming_ack:
  # numeric suffix: the -N carries no meaning
  #   does: Share a Recording Link.
  "numeric-suffix POST /v1/recordings/accessList":
    command: admin-recordings create-access-list-recordings-1
