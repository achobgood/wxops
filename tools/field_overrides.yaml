        "delete-handsets-dect-networks": "delete-location-handsets-dect-networks"
        "delete-handsets-dect-networks-1": "delete-handsets-dect-networks-bulk"
    # Found 2026-07-27 while wiring argument help, not by the d3 detector.
    # In `location-settings` the BARE `list` returns dial patterns
    # (/premisePstn/dialPlans/{id}/dialPatterns) while `list-1` returns the
    # locations (/telephony/config/locations). An agent typing the obvious name
