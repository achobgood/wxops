    # single most-cited producer command in argument help (212 of 1,051
    # pointers), so leaving a dedup-artifact name there teaches every agent to
    # type it. Both keep their old names as hidden aliases.
    "Location Call Settings":
      command_name_overrides:
        "list": "list-dial-patterns"
        "list-1": "list-calling-details"
      # A caveat the spec cannot express. safe-delete-check answers "can I
      # delete this?" with UNBLOCKED whenever every dependency count is 0 —
      # true, and still not the whole answer: a calling-enabled location with
      # zero dependencies returns 409 "being referenced" on delete. That cost a
      # live teardown session real time, and the remedy is a command most
      # operators do not know exists. Keyed here rather than in the top-level
      # "Location Call Settings" block, which is shadowed and inert.
      command_help_notes:
        safe-delete-check: >
          UNBLOCKED means no dependencies block deletion. It does NOT mean the
          location can be deleted right now: a location still enabled for Webex
          Calling returns 409 'being referenced' even with every count at 0.
          Disable calling first with 'wxcli location-settings
          create-delete-calling-location --location-id LOCATION_ID
          --location-name NAME', poll the returned job via 'wxcli
          location-settings show-delete-calling-location JOB_ID' until
          latestExecutionStatus is COMPLETED, then delete the location.

