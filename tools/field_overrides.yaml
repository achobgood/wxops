# Needed when a tag name collides across specs (e.g. "Flow"), since a top-level
# block is keyed on the tag name alone. The two forms MERGE key by key, with
# tag_overrides winning — see the comment at the merge in generate_commands.py
# for why that used to be a silent discard.
tag_overrides:
