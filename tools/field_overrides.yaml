# Global settings
# ═══════════════════════════════════════════════════════════════════════════════

omit_query_params: []
auto_inject_from_config: ["orgId", "orgid"]

# Tags to skip entirely (glob patterns matched against OpenAPI tag names).
#
# Two shapes are supported:
#   - flat list (legacy) — applies to every spec
#   - mapping with ``_global`` + per-spec-filename keys — canonical routing
#
# When a tag appears in multiple specs with identical endpoints (e.g. People
# appears in calling + admin + messaging + meetings), list that tag under the
# OTHER specs so the canonical spec is the only one that renders the file.
# This guarantees that `generate_commands.py --all` against every spec yields
# a deterministic set of files without overwrites, and that generator fixes
# (pagination, etc.) propagate to every target file.
#
# Canonical assignments (2026-04-15):
#   - People, Reports, Recording Report, Partner Reports/Templates,
#     Device Call Settings, Device Call Settings With Device Dynamic Settings,
#     Hot Desk                 -> webex-cloud-calling.json
#   - Devices, Workspaces      -> webex-device.json
skip_tags:
  _global:
    - "Beta *"           # Beta APIs — unstable contracts, excluded until GA
  webex-cloud-calling.json:
    - "Devices"          # canonical: webex-device.json
    - "Workspaces"       # canonical: webex-device.json
  webex-admin.json:
    - "People"           # canonical: webex-cloud-calling.json
    - "Reports"          # canonical: webex-cloud-calling.json
    - "Recording Report" # canonical: webex-cloud-calling.json
    - "Partner Reports/Templates"  # canonical: webex-cloud-calling.json
  webex-device.json:
    - "Device Call Settings"                                      # canonical: webex-cloud-calling.json
    - "Device Call Settings With Device Dynamic Settings"         # canonical: webex-cloud-calling.json
    - "Hot Desk"                                                  # canonical: webex-cloud-calling.json
  webex-messaging.json:
    - "People"           # canonical: webex-cloud-calling.json
  webex-meetings.json:
    - "People"           # canonical: webex-cloud-calling.json
    - "Recording Report" # canonical: webex-cloud-calling.json
    - "Recordings"       # canonical: webex-admin.json (same 14 /recordings ops in both specs)
  webex-contact-center.json:
    - "Functions"        # colon-action paths (/functions/{id}:publish) — generator cannot
                         # render ':' path segments yet; deliberate gap until colon-path
                         # support lands (refactor-plan S1.3). 11 ops.
    - "Activities"       # flow-store surface embedded in the CC spec (/flow-store/... paths);
    - "Templates"        # covered by the dev-only fs-* groups generated from the untracked
    - "Events"           # webex-flow-store.json. Deliberate gap in the tracked CLI. 6 ops.
  webex-flow-store.json:
    - admin-flow-controller    # internal admin endpoints
    - auth-controller          # OAuth redirect (handled by SDK)
    - buid-info-controller     # build info endpoint
    - health-controller        # health check
    - prometheus-controller    # metrics endpoint

# Drop spurious tag/operation pairings present in the upstream spec.
# tag -> list of path globs that carry the tag but do not belong to it.
tag_op_excludes:
  webex-cloud-calling.json:
    # Upstream tags all 24 /telephony/calls/* call-control ops with a second
    # "External Voicemail" tag. They are call control (dial, answer, hangup)
    # and already render into the call-controls group; the only real External
    # Voicemail endpoint is /telephony/externalVoicemail/mwi. Without this
    # filter, per-tag dedup renders all 24 into external-voicemail and the
    # "dial" op wins the bare `create` name, so `external-voicemail create`
    # silently dials a call instead of setting the message-waiting indicator.
    # That exact break shipped once — see known issue #22 in tools/CLAUDE.md.
    "External Voicemail":
      - "/telephony/calls"
      - "/telephony/calls/*"

# ═══════════════════════════════════════════════════════════════════════════════
# Verb-vs-semantics acks — known issue #20
# ═══════════════════════════════════════════════════════════════════════════════
# Command names come from the HTTP method, but Cisco models some deletes as
# PUT/POST with a delete-body: the verb says update, the operation deletes. The
# generator classifies real semantics from the summary and the body shape, and
# hard-fails on any destructive op whose name gives no hint it destroys.
#
# Listing an op here says: the misleading NAME is deliberate, reviewed, and kept
# for compatibility. It does NOT silence the fix — the success message and the
# --help text follow the real semantics for every flagged op, acked or not.
# The value is the real verb; if the generator's classification stops matching
# it, generation fails rather than letting the ack rot.
#
# Names were kept rather than renamed (2026-07-14, Adam): renaming is
# user-facing and breaks anyone scripting the old name, and the actively harmful
# half was the success message, which now tells the truth.
verb_semantics_ack:
  webex-cloud-calling.json:
    # All four accessCodes PUTs are delete-only: `deleteCodes` is their sole
    # body field, so they cannot add or modify. Creating is a separate POST on
    # the same path. Only the location one has an honest summary ("Delete
    # Outgoing Permission Access Code Location"); the other three say "Modify
    # Access Codes", which is why summary-scanning alone never found them.
    "PUT /telephony/config/locations/{locationId}/outgoingPermission/accessCodes": delete
    "PUT /telephony/config/people/{personId}/outgoingPermission/accessCodes": delete
    "PUT /telephony/config/virtualLines/{virtualLineId}/outgoingPermission/accessCodes": delete
    "PUT /workspaces/{workspaceId}/features/outgoingPermission/accessCodes": delete
  webex-contact-center.json:
    # `cc-agent-greetings create` deletes greeting-file references. The bare
    # `create` name is the worst of the set; kept only for compatibility.
    "POST /organization/{orgid}/agent-personal-greeting/delete-reference": delete
    "PATCH /admin/v1/api/person/remove-identities/workspace-id/{workspaceId}/person-id/{personId}": remove

# ═══════════════════════════════════════════════════════════════════════════════
# Spec authority — which spec tells the truth when two disagree (drift check 9)
# ═══════════════════════════════════════════════════════════════════════════════
# 60 operations have a list-item schema in more than one tracked spec. For 53 the
# specs agree and there is nothing to decide. For the 7 below they DISAGREE, and
# check 9 used to union their fields — so a column only one spec declared always
# looked valid. That union hid a live-broken `locations list` for months.
#
# An entry names the spec check 9 resolves the item schema through, and the basis
# for believing it. `spec: union` keeps the old permissive behavior where nothing
# has been verified — it is deliberately weaker, and saying so is the point.
#
# A conflicting operation with NO entry here hard-fails check 9. That is the
# ratchet: a spec refresh that introduces a new disagreement cannot land silently.
#
#   basis: live       — a real response was captured and the fields counted
#   basis: unverified — no live sample; union retained, still under-reporting
#
# `live_fields` covers the other half of the problem: a spec can be wrong by
# OMISSION as well as by invention. Cisco's calling spec declares only id and
# name for /locations, but the live response also carries orgId, address,
# timeZone and preferredLanguage. Those cannot go in specs/overlays/ — overlays
# are additive at the PATH level and must never shadow a path upstream already
# publishes (tools/spec_overlay.py rule 1, enforced by check 5). So they are
# declared here, typed, with the capture that proves them. Format:
#   live_fields: name:type, name:type
spec_authority:
  # Live capture 2026-07-27, org ahobgood-lab: items carry exactly
  # id, name, orgId, address{}, timeZone, preferredLanguage. The device spec's
  # displayName / locationId / countryCode / cityName / latitude / longitude /
  # notes are NOT returned by this endpoint — that spec is simply wrong here,
  # and it is the one that generated locations.py (it runs after cloud-calling
  # in spec_sync's PREFERRED_ORDER, so it wins the file).
  "GET /locations":
    spec: webex-cloud-calling.json
    basis: live
    live_fields: orgId:string, address:object, timeZone:string, preferredLanguage:string
  # No live sample: reaching these needs a real device job that has already
  # failed. Union retained knowingly rather than guessing between the two.
  "GET /telephony/config/jobs/devices/callDeviceSettings":
    spec: union
    basis: unverified
  "GET /telephony/config/jobs/devices/callDeviceSettings/{}/errors":
    spec: union
    basis: unverified
  "GET /telephony/config/jobs/devices/dynamicDeviceSettings/{}/errors":
    spec: union
    basis: unverified
  "GET /telephony/config/jobs/devices/rebuildPhones/{}/errors":
    spec: union
    basis: unverified
  # Device spec carries 35 fields vs cloud-calling's 9 and is the spec that
  # generated the module; no live capture yet to confirm which is right.
  "GET /telephony/config/supportedDevices":
    spec: union
    basis: unverified
  # Partner-scoped; not reachable with this org's token.
  "GET /partner/reports/templates":
    spec: union
    basis: unverified

