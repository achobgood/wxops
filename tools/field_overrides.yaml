# Migrated 2026-07-29 from the old-style folder-level `list: {table_columns:}`
# form, which had never applied (shadowed whole by the tag_overrides entry for
# this tag under webex-admin.json — the only spec that generates it, since
# webex-meetings.json's identical 14 ops are skipped). The tag has exactly three
# list commands, all the same recordings resource, and all four columns are
# declared on all three item schemas — so the old block's intent carries over
# per-command with nothing left over. The derived default reaches for
# meetingId / scheduledMeetingId / meetingSeriesId: three near-identical base64
# IDs where an operator wants the format and the time. `list-recordings-admin`
# additionally declares hostEmail / hostDisplayName — use --fields for those.
"Recordings":
  table_columns:
    list: &admin_recording_cols
      - ["ID", "id"]
      - ["Topic", "topic"]
      - ["Format", "format"]
      - ["Created", "timeRecorded"]
    list-recordings-admin: *admin_recording_cols
    list-recordings-group: *admin_recording_cols

# Upstream's PATCH .../campaigns/{campaignId}/contacts/{contactId} declares a
# query param literally named "fields" — server-side selection of which contact
# fields come back. That is NOT the same operation as wxcli's universal
# --fields, a client-side JMESPath post-filter, so neither can be dropped in
# favour of the other. They only clash on spelling, so the spec one is spelled
# --contact-fields; the wire still receives "fields" (request assembly keys off
# the spec name). Without this the generator hard-fails with
# ReservedParamCollisionError, by design.
"Contact List Management":
  param_name_overrides:
    update-contacts:
      fields: contact-fields

# ═══════════════════════════════════════════════════════════════════════════════
# Meetings spec — table columns
# ═══════════════════════════════════════════════════════════════════════════════

# Every list-* here extracts a different sub-resource (questions, registrants,
# breakout sessions...), none of which has title/start/end/state. Note
# list-registrants is the dangerous one: Registrant HAS an address `state`, so
# the old column silently rendered a US state code under a "State" header an
# operator would read as registration status.
"Meetings":
  table_columns:
    list:
      - ["ID", "id"]
      - ["Title", "title"]
      - ["Start", "start"]
      - ["End", "end"]
      - ["State", "state"]
    list-registration:
      - ["ID", "id"]
      - ["Question", "question"]
      - ["Type", "type"]
      - ["Required", "required"]
    list-registrants:
      - ["ID", "id"]
      - ["First Name", "firstName"]
      - ["Last Name", "lastName"]
      - ["Email", "email"]
      - ["Status", "status"]
    list-breakout-sessions:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Start Time", "startTime"]
      - ["End Time", "endTime"]
    list-survey:
      - ["ID", "id"]
      - ["Question", "question"]
      - ["Type", "type"]
    list-invitation-sources:
      - ["ID", "id"]
      - ["Source ID", "sourceId"]
      - ["Source Email", "sourceEmail"]
      - ["Join Link", "joinLink"]
    list-tracking-codes:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Site URL", "siteUrl"]
      - ["Service", "service"]
      - ["Type", "type"]

"Participants":
  list:
    table_columns:
      - ["ID", "id"]
      - ["Display Name", "displayName"]
      - ["Email", "email"]
      - ["Joined", "joinedTime"]
      - ["State", "state"]

"Invitees":
  list:
    table_columns:
      - ["ID", "id"]
      - ["Display Name", "displayName"]
      - ["Email", "email"]

# Per-command style: the old `list: {table_columns:}` block applied to every
# list-shaped command in the tag, so the transcript columns leaked onto
# list-snippets, whose items are snippet text, not transcripts. There is no
# `title` on either — the transcript's label is `meetingTopic`.
"Transcripts":
  table_columns:
    list: &transcript_cols
      - ["ID", "id"]
      - ["Meeting Topic", "meetingTopic"]
      - ["Meeting ID", "meetingId"]
      - ["Start Time", "startTime"]
      - ["Status", "status"]
    list-meeting-transcripts: *transcript_cols
    list-snippets:
      - ["ID", "id"]
      - ["Person Name", "personName"]
      - ["Text", "text"]

# Video Mesh and Session Types deliberately carry NO table_columns. Both
# returned ID/Name from an old-style block and rendered blank on every row:
# neither response has an `id` or a `name`. The renderer now derives columns
# from each endpoint's own item schema, which is the best available answer for
# both. Video Mesh nests its real payload one level deeper than the extractor
# reaches (`items[].items`), so its tables show the response window, not the
# measurements — the video-mesh skill tells operators to use -o json for those.

# GetTrackingCodeObject has no `service`; the per-user item has only id/name/value
# (siteUrl belongs to the request wrapper, not the item).
"Tracking Codes":
  table_columns:
    list:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Site URL", "siteUrl"]
    list-tracking-codes:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Value", "value"]

