# ── field_overrides.yaml ──
# Overrides for the wxcli OpenAPI-based generator (tools/generate_commands.py).
#
# The OpenAPI spec now provides: response schemas, required fields, command types,
# enum values, and descriptions. This file only contains what the spec does NOT provide:
#
#   table_columns       — display columns for CLI table output (per-group or per-command)
#   skip_tags           — glob patterns for OpenAPI tags to skip entirely
#   tag_merge           — merge split tags into one CLI group
#   tag_op_excludes     — drop spurious tag/operation pairings (tag → path globs)
#   verb_semantics_ack  — acked verb-vs-semantics mismatches (issue #20)
#   cli_name_overrides  — human-friendly CLI group names (tag → CLI name)
#   omit_query_params   — query params stripped from all commands
#   spec_authority      — which spec wins when two describe one op differently
#
# Per-tag keys (alongside table_columns etc.):
#   param_name_overrides — rename a spec param's CLI flag; wire name unchanged.
#                          Use when a spec param collides with --fields/--output.
#                          {command: {spec_param: new-kebab-name}}. Validated at
#                          generation time, so a stale entry fails loudly.
#

# ═══════════════════════════════════════════════════════════════════════════════
# Table columns — display preferences for CLI table output
# ═══════════════════════════════════════════════════════════════════════════════

"Report Templates":
  list:
    table_columns:
      - ["ID", "id"]   # schema field is lowercase; _resolve_accessor is case-sensitive
      - ["Title", "title"]
      - ["Service", "service"]
      - ["Max Days", "maxDays"]

# CDR record keys are space-separated Title-case, NOT camelCase — confirmed by
# the spec's own property names, docs/reference/reporting-analytics.md, and the
# cdr-recipes written against real data (r.get('Start time')). With camelCase
# every column resolved empty, which tripped output.py's auto_columns fallback
# and ballooned the table to 40+ auto-detected columns instead of rendering blank.
"Reports: Detailed Call History":
  table_columns:
    list: &cdr_cols
      - ["Start Time", "Start time"]
      - ["Calling Number", "Calling number"]
      - ["Called Number", "Called number"]
      - ["Duration", "Duration"]
      - ["Direction", "Direction"]
      - ["Call Type", "Call type"]
    list-cdr_stream: *cdr_cols

# Per-command style, NOT the old `list: {table_columns:}` block. The old style
# falls through command_renderer.py:580 and is applied to EVERY list-shaped
# command in the tag, so the parent entity's columns leaked onto the
# list-available-* siblings, which return raw number/greeting records.
"Features:  Auto Attendant":
  table_columns:
    list:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Extension", "extension"]
      - ["Location", "locationName"]
      - ["Phone Number", "phoneNumber"]
    list-available-numbers-auto-attendants: &available_numbers_cols
      - ["Phone Number", "phoneNumber"]
      - ["State", "state"]
      - ["Telephony Type", "telephonyType"]
      - ["Toll Free", "tollFreeNumber"]
    list-available-numbers-alternate: *available_numbers_cols
    list-available-numbers-call-forwarding: &available_fwd_cols
      - ["Phone Number", "phoneNumber"]
      - ["Extension", "extension"]
      - ["State", "state"]
      - ["Owner Type", "owner.type"]
      - ["Owner Name", "owner.firstName"]
    list-announcements:
      - ["ID", "id"]
      - ["File Name", "fileName"]
      - ["Level", "level"]
      - ["Media Type", "mediaFileType"]

# Migrated 2026-07-29 from the old-style folder-level `list: {table_columns:}`
# form, which applies its columns to EVERY list-shaped command in the tag. This
# tag has 17, and only the bare `list` can fill `extension`/`enabled` — the
# other 16 return announcements, agents, supervisors or available numbers. The
# block never took effect (the tag_overrides entry below shadowed it whole), and
# that shadowing was the only thing holding check 9 at 0 here. Same four columns
# as `Features:  Hunt Group` list, so the sibling entities read alike.
#
# An `add_query_params` block was deleted in the same change: it added a
# hasCxEssentials QUERY param to delete-supervisors-config, whose spec declares
# hasCxEssentials in the BODY. Proven by regen diff — the injected query param
# claims the CLI name, `_used_param_names` then drops the body field
# (issue #19), and the existing --has-cx-essentials silently stops reaching the
# body the API reads. Full reasoning in tools/CLAUDE.md.
"Features:  Call Queue":
  table_columns:
    list:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Extension", "extension"]
      - ["Enabled", "enabled"]

"Features:  Call Park":
  table_columns:
    list:
      - ["ID", "id"]
      - ["Name", "name"]
    # returns agents[], which has displayName/email — not `name`
    list-available-users:
      - ["ID", "id"]
      - ["Display Name", "displayName"]
      - ["Email", "email"]

"Features:  Hunt Group":
  table_columns:
    list:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Extension", "extension"]
      - ["Enabled", "enabled"]
    list-available-numbers-hunt-groups: &hg_available_numbers
      - ["Phone Number", "phoneNumber"]
      - ["State", "state"]
      - ["Telephony Type", "telephonyType"]
      - ["Toll Free", "tollFreeNumber"]
    list-available-numbers-alternate: *hg_available_numbers
    list-available-numbers-call-forwarding:
      - ["Phone Number", "phoneNumber"]
      - ["Extension", "extension"]
      - ["State", "state"]
      - ["Owner Type", "owner.type"]
      - ["Owner Name", "owner.firstName"]
  body_defaults:
    create:
      callPolicies:
        policy: "CIRCULAR"
        noAnswer:
          nextAgentEnabled: true
          nextAgentRings: 3
          forwardEnabled: false
          numberOfRings: 15
          destinationVoicemailEnabled: false
      agents: []
      enabled: true

"Features:  Call Pickup":
  table_columns:
    list:
      - ["ID", "id"]
      - ["Name", "name"]
    # returns agents[], which has displayName/phoneNumber — not `name`
    list-available-users:
      - ["ID", "id"]
      - ["Display Name", "displayName"]
      - ["Phone Number", "phoneNumber"]

"Features:  Paging Group":
  table_columns:
    list:
      - ["ID", "id"]
      - ["Name", "name"]
      - ["Extension", "extension"]
      - ["Location", "locationName"]
      - ["Phone Number", "phoneNumber"]
    list-available-numbers:
      - ["Phone Number", "phoneNumber"]
      - ["State", "state"]
      - ["Telephony Type", "telephonyType"]
      - ["Toll Free", "tollFreeNumber"]

# `routeType` exists nowhere in the premisePstn/routeGroups/trunks/dialPlan
# schemas — it rendered blank on all 13 commands. The nearest real concept is
# Trunk.trunkType. Migrated to per-command style so each endpoint's own shape
# is respected (most return a bare {id,name} Location or usage record).
"Call Routing":
