# dumping the address as a raw Python dict. The auto-derived columns came from
# webex-device.json, which claims this endpoint returns displayName/locationId/
# countryCode; a live capture (2026-07-27, org ahobgood-lab) shows it returns
# none of them. Real payload: id, name, orgId, address{}, timeZone,
# preferredLanguage. Address is an object, so the useful scalars are reached
# through dotted accessors, which output.py:_resolve_accessor already walks.
