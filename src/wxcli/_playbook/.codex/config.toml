# wxcli Codex playbook config — GENERATED into .codex/config.toml. Do not hand-edit.
# These apply once you trust this folder in Codex (codex trusts the repo/cwd).
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# NO SAFETY GATE SHIPS HERE YET. The other playbook variant ships a pre-tool-use
# hook that routes state-changing wxcli calls through the wxc-calling-builder
# agent; here, the only guard on a destructive command is the CLI's own
# confirmation prompt.
#
# Verified on Codex 0.147.0 (2026-08-10): the design IS portable. Working config
# in .codex/hooks.json (project) or ~/.codex/hooks.json (global):
#
#   { "hooks": { "PreToolUse": [ { "matcher": "^Bash$",
#       "hooks": [ { "type": "command", "command": "sh <abs path>/gate.sh" } ] } ] } }
#
#   - Event keys are CamelCase. snake_case PARSES WITHOUT ERROR and matches
#     nothing, which is a silent no-gate.
#   - The shell tool is `Bash`; `exec` is only the tool_use_id prefix.
#   - `deny` does block execution, even under bypassPermissions.
#   - A loaded custom agent reports its own name in `agent_type`, so the policy
#     is: agent_type == "wxc-calling-builder" -> allow, anything else -> deny.
#
# THREE CONSTRAINTS, all measured, before anyone builds this:
#   1. FAILURE IS FAIL-OPEN. An unsupported decision ("ask") yields
#      `hook: PreToolUse Failed` AND THE COMMAND RUNS. So does any hook that
#      cannot execute -- including a command path that does not resolve. Emit
#      only "allow" or "deny", and treat path resolution as a safety property.
#   2. `agent_type` is NOT documented for PreToolUse (only for Subagent*). It is
#      observed runtime behaviour. If a future version drops it, every caller
#      looks anonymous and the BUILDER is denied too -- safe, but every write
#      workflow stops, so the deny reason must say so.
#   3. Version-dependent. Codex 0.144.1 silently REJECTS hyphenated agent names,
#      so wxc-calling-builder does not load there at all. 0.147.0 accepts them.
#
# The "newer wxcli on PyPI" nudge needs no hook either way: the CLI prints a
# one-line update banner on startup (see update_check.py).
