name: Release

on:
  push:
    # ONE event, two refs. A second `release:` trigger would publish twice: a human
    # `gh release create vX.Y.Z` also creates the tag and lands on `tags` too.
    tags: ['v*']              # humans: git tag -a vX.Y.Z -F notes && git push origin vX.Y.Z
    branches: ['release/v*']  # the spec-sync routine. Its sandbox git proxy refuses refs/tags
                              # (HTTP 403 x3, run 2026-09-14) but accepts branches, so it pushes
                              # release/vX.Y.Z at the commit to release and this job makes the tag.
                              # A tag pushed with github.token starts no workflow run, so the tag
                              # this job pushes does not come back in on `tags`.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC for PyPI Trusted Publishing
      contents: write      # upload assets to the Release
      actions: read        # the CI gate reads this SHA's workflow runs
    env:
      REF_NAME: ${{ github.ref_name }}   # the tag, or release/vX.Y.Z; never interpolate it into a run: body
      REF_TYPE: ${{ github.ref_type }}   # tag | branch. TAG is set only by "Resolve the release tag"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # setuptools-scm needs full history + the tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require green CI on the exact SHA being released
        # The backstop that would have blocked v1.6.0 (published 2026-09-08
        # from a tree whose drift gate had been red for five weeks). This is
        # independent of the spec-sync agent on purpose: it catches a human
        # cutting a release from the web UI just as well. Fail closed on
        # anything but a completed+success NEWEST run — "no run found" is not
        # evidence of anything and must not pass.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "release sha=$SHA ($REF_TYPE $REF_NAME)"
          RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=10" \
                    --jq '[.workflow_runs[] | {id, status, conclusion, created_at}]')"
          echo "ci runs on this sha: $RUNS"
          COUNT="$(echo "$RUNS" | jq 'length')"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No CI run found for $SHA — absence of evidence is not a pass. Push the commit, let CI finish, then re-publish."
            exit 1
          fi
          # The API lists runs newest first; judge the newest only, so a re-run
          # that went green counts and a re-run that went red counts too.
          STATUS="$(echo "$RUNS" | jq -r '.[0].status')"
          CONCLUSION="$(echo "$RUNS" | jq -r '.[0].conclusion')"
          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Newest CI run on $SHA is $STATUS/$CONCLUSION, not completed/success — refusing to publish."
            exit 1
          fi
          echo "CI is green on $SHA"

      - name: Resolve the release tag
        # A tag push names the tag itself. A release/vX.Y.Z branch push must carry
        # everything a human tag would have: a strict version, notes written for THIS
        # version, a commit main already has, and no existing tag. The annotated tag is
        # made locally here so setuptools-scm stamps the build; it reaches origin only
        # in "Push the tag", just before PyPI.
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "TAG=$REF_NAME" >> "$GITHUB_ENV"; exit 0
          fi
          TAG="${REF_NAME#release/}"
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Branch $REF_NAME does not name a vX.Y.Z version"; exit 1
          fi
          NOTES=docs/spec-sync/release-notes.md
          case "$(head -1 "$NOTES" 2>/dev/null)" in
            "# $TAG "*) ;;
            *) echo "::error::$NOTES is missing or was not written for $TAG — refusing to reuse another release's notes"; exit 1;;
          esac
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main — a release branch may only point at a commit main already has"; exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Tag $TAG already exists on origin — that version is burned; use the next one"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a --cleanup=verbatim "$TAG" -F "$NOTES"   # default cleanup strips every `#` line = every Markdown heading (measured)
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Playbook bundle freshness guard
        run: |
          python wxcli-dist/assemble.py
          if [ -n "$(git status --porcelain -- src/wxcli/_playbook)" ]; then
            git status --porcelain -- src/wxcli/_playbook
            echo "::error::src/wxcli/_playbook (Claude + Codex playbook) is stale — run 'python wxcli-dist/assemble.py', review the diff, commit, re-tag."
            exit 1
          fi

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the installed wheel playbook
        run: python tools/wheel_playbook_smoke.py dist/wxcli-*.whl

      - name: Version guard (never publish a dirty version)
        run: |
          EXPECTED="${TAG#v}"
          BUILT=$(ls dist/*.whl | sed -E 's#.*/wxcli-([^-]+)-py3-none-any\.whl#\1#')
          echo "tag=$TAG expected=$EXPECTED built=$BUILT"
          if [ "$BUILT" != "$EXPECTED" ]; then
            echo "::error::Built version $BUILT != tag $EXPECTED"; exit 1
          fi
          case "$BUILT" in
            *.dev*|*+*) echo "::error::Dirty version $BUILT"; exit 1;;
          esac

      - name: Push the tag (release branch only)
        # Just before PyPI, so both paths reach PyPI with the tag already on origin: a
        # publish that fails after this leaves the tag burned, and sync_version skips it.
        if: github.ref_type == 'branch'
        run: git push origin "refs/tags/$TAG"

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub Release from the tag
        # After PyPI on purpose: a Release with no package behind it would be a lie,
        # and a failed publish leaves the tag burned (sync_version skips it) with no
        # Release to clean up. `gh release view ||` makes a human's gh release create
        # — which already made the Release before the tag push fired — a no-op.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-from-tag --verify-tag

      - name: Attach artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*

      - name: Delete the release branch
        # The tag names the release now; the branch was only the sandbox's way to ask for it.
        if: github.ref_type == 'branch'
        run: git push origin --delete "refs/heads/$REF_NAME"
