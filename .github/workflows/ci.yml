name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # pytest-asyncio is required, not optional: pyproject sets
          # asyncio_mode = "auto" and 7 test modules use `async def test_*`.
          pip install pytest pytest-asyncio

      - name: Run tests (excluding live API tests)
        run: |
          pytest tests/ -m "not live" -v --tb=short

  drift-gate:
    name: Drift gate (docs <-> CLI <-> spec coherence)
    runs-on: ubuntu-latest
    # A SEPARATE job on purpose. This gate is the only thing standing between a
    # fabricated `wxcli ...` reference and the docs the agent is REQUIRED to read
    # (CLAUDE.md's Mandatory Grounding Rule). Bundling it into `test` would let a
    # flaky unit test mask a docs-drift failure and vice versa — they are
    # independent signals and must be able to fail independently.
    #
    # Deliberately does NOT `pip install` anything: drift_check.py reads the CLI
    # surface statically (regex + stdlib ast over tracked sources) and shells out
    # to `git ls-files`. Dependency-free means it cannot be broken by a dependency
    # resolution problem, and it runs in seconds.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drift gate (enforcing)
        run: |
          python tools/drift_check.py --enforce

  playbook-freshness:
    name: Playbook bundle freshness
    runs-on: ubuntu-latest
    # src/wxcli/_playbook/ is GENERATED from the canonical .claude/ + docs/ by
    # wxcli-dist/assemble.py and ships inside the wheel. release.yml already
    # guards this at tag time; running it here fails the PR instead of the
    # release, so a stale bundle never reaches a tag.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the generated Claude + Codex playbook
        run: python wxcli-dist/assemble.py

      - name: Fail if the committed bundle is stale
        run: |
          if [ -n "$(git status --porcelain -- src/wxcli/_playbook)" ]; then
            git status --porcelain -- src/wxcli/_playbook
            echo "::error::src/wxcli/_playbook is stale — run 'python wxcli-dist/assemble.py', review the diff, and commit."
            exit 1
          fi
          echo "playbook bundle is up to date"

  release-integrity:
    name: Release integrity (built wheel)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild generated Claude and Codex playbook
        run: python wxcli-dist/assemble.py

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify the installed wheel playbook
        run: python tools/wheel_playbook_smoke.py dist/wxcli-*.whl
