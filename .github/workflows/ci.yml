name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # pytest-asyncio is required, not optional: pyproject sets
          # asyncio_mode = "auto" and 7 test modules use `async def test_*`.
          # aioresponses likewise: 6 tracked migration/execute modules import it
          # to stub aiohttp. It is declared nowhere else, so a dev with it
          # installed sees green locally while CI cannot even collect them.
          pip install pytest pytest-asyncio aioresponses
          # aiohttp is pinned HERE and not in pyproject on purpose: nothing is
          # wrong with the CLI on aiohttp 3.14 — the break is in the test double.
          # aioresponses 0.7.9 builds a ClientResponse by hand and does not pass
          # `stream_writer`, which aiohttp 3.14 made a required kwarg, so every
          # test that stubs aiohttp dies with TypeError at request time. Its own
          # metadata claims `aiohttp<4.0,>=3.8`, so pip will not resolve away
          # from it and the pin has to be ours. Pinning the runtime dep in
          # pyproject instead would constrain USERS for a test-only defect.
          # Drop this the moment aioresponses supports 3.14 (28 tests, all in
          # tests/migration/execute/, will tell you immediately).
          pip install 'aiohttp<3.14'

      - name: Run tests (excluding live API tests)
        # TERM=dumb, not NO_COLOR=1. rich special-cases GitHub Actions as a
        # colour-capable terminal, so `--help` output comes back wrapped in ANSI
        # and `assert "--host" in result.output` fails on text that renders
        # correctly. NO_COLOR is the wrong knob and was measured failing: it
        # suppresses colour but NOT bold/dim, so rich still emits `\x1b[1m`
        # between the dashes and still splits the flag. TERM=dumb makes
        # rich's is_terminal false, which is what actually yields plain text.
        # COLUMNS is set for the same reason the repo drives every real
        # `--help` as `COLUMNS=400 TERM=dumb`: at 80 cols rich wraps a long flag
        # declaration onto a second line and a substring assertion misses it.
        env:
          TERM: dumb
          COLUMNS: "400"
        run: |
          pytest tests/ -m "not live" -v --tb=short

  drift-gate:
    name: Drift gate (docs <-> CLI <-> spec coherence)
    runs-on: ubuntu-latest
    # A SEPARATE job on purpose. This gate is the only thing standing between a
    # fabricated `wxcli ...` reference and the docs the agent is REQUIRED to read
    # (CLAUDE.md's Mandatory Grounding Rule). Bundling it into `test` would let a
    # flaky unit test mask a docs-drift failure and vice versa — they are
    # independent signals and must be able to fail independently.
    #
    # This job used to install NOTHING, on the stated grounds that
    # drift_check.py reads the CLI surface statically (regex + stdlib ast over
    # tracked sources) and shells out to `git ls-files` — so no dependency
    # resolution could ever break it.
    #
    # That is no longer true, and the job did not notice for 11 days. Check 15
    # imports the generator's own resolvers rather than reimplementing them
    # (deliberate — it is how the two are kept from diverging), and the
    # generator chain reaches tools/command_renderer.py, which imports `wxcli`
    # itself. Checks 15/16 also `import yaml`, because field_overrides.yaml has
    # three levels of nesting and folded scalars that load_overrides()'s
    # hand-rolled line parser deliberately cannot read.
    #
    # So the gate crashed with ModuleNotFoundError BEFORE check 1 and reported
    # nothing, while looking like an ordinary red build — indistinguishable from
    # a gate that ran and found problems, unless you open the log. Both fixes
    # below were verified in a clean venv:
    #   1. `pip install -e .` — the gate needs the package, not just PyYAML.
    #   2. `python -m tools.drift_check`, NOT `python tools/drift_check.py`.
    #      Running it as a script puts tools/ on sys.path instead of the repo
    #      root, so `from tools.openapi_parser import ...` fails even when the
    #      package IS installed. Measured: script form exit 1, module form
    #      exit 0 / result: PASS, same tree, same venv.
    #
    # It is still a SEPARATE job from `test` on purpose (see below), but it is
    # no longer dependency-free — if that property matters again, the thing to
    # change is check 15's import of the generator, not this comment.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package the gate imports
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Drift gate (enforcing)
        run: |
          python -m tools.drift_check --enforce

  playbook-freshness:
    name: Playbook bundle freshness
    runs-on: ubuntu-latest
    # src/wxcli/_playbook/ is GENERATED from the canonical .claude/ + docs/ by
    # wxcli-dist/assemble.py and ships inside the wheel. release.yml already
    # guards this at tag time; running it here fails the PR instead of the
    # release, so a stale bundle never reaches a tag.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the generated Claude + Codex playbook
        run: python wxcli-dist/assemble.py

      - name: Fail if the committed bundle is stale
        run: |
          if [ -n "$(git status --porcelain -- src/wxcli/_playbook)" ]; then
            git status --porcelain -- src/wxcli/_playbook
            echo "::error::src/wxcli/_playbook is stale — run 'python wxcli-dist/assemble.py', review the diff, and commit."
            exit 1
          fi
          echo "playbook bundle is up to date"

  release-integrity:
    name: Release integrity (built wheel)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild generated Claude and Codex playbook
        run: python wxcli-dist/assemble.py

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify the installed wheel playbook
        run: python tools/wheel_playbook_smoke.py dist/wxcli-*.whl
